name: Build NASA POWER snapshots
# Run manually: Actions -> Build NASA POWER snapshots -> Run workflow.
# Downloads real NASA POWER daily history (2001 to present) for the grid cells of all 64
# districts, verifies it, and uploads data/processed/power_history as an artifact.
# Download the artifact, unzip it into the repository's data/processed/power_history/, and commit.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements-dev.txt
      - name: Download real NASA POWER history
        run: python -m scripts.build_snapshot
      - name: Verify snapshot integrity and coverage
        run: |
          python - <<'PY'
          from backend.app.services.power_history import snapshot_health
          r = snapshot_health()
          print(r)
          assert r["status"] == "ok" and r["cells"] > 0, r
          PY
      - name: Run the tests against the committed layout
        env:
          OFFLINE: "1"
        run: python -m pytest -q backend/tests
      - uses: actions/upload-artifact@v4
        with:
          name: boponx-power-history
          path: data/processed/power_history/
          retention-days: 30
          if-no-files-found: error

name: Backend validation
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: Lint
        run: ruff check backend scripts data --select E9,F63,F7,F82
      - name: Run offline tests (includes the no-fabrication guard)
        run: python -m pytest -q backend/tests
      - name: Verify committed NASA POWER snapshots (if present)
        run: python -c "from backend.app.services.power_history import snapshot_health as h; r=h(); print(r); assert r['status'] in ('ok','no_snapshots'), r"
